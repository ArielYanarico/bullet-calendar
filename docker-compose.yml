version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: bullet-calendar-postgres
    restart: unless-stopped
    env_file:
    - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - bullet-calendar-network

volumes:
  postgres_data:
    driver: local

networks:
  bullet-calendar-network:
    driver: bridge